services:
  hp-scan-to-computer:
    build:
      context: .
      dockerfile: Dockerfile
    image: hp-scan-to-computer:latest
    container_name: hp-scan-to-computer
    pull_policy: build
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
    volumes:
      - ${CONFIG_PATH:-./config.json}:/app/config.json:ro
      - ${CONSUME_PATH:-./consume}:/consume